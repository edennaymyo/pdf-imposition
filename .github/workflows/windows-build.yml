name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-desktop
      - feature/front-back-duplex

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build Windows x64 installer
        run: npm run desktop:win

      - name: Write installer checksum
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: repeat-pdf-imposition-windows
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
